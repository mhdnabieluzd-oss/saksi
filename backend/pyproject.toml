[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saksi-backend"
version = "1.0.0"
description = "SAKSI — Analyst-supervised autonomous cyber-investigation and digital-forensics backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "websockets==17.4",
    "python-multipart==0.0.33",
    "pydantic==2.14.3",
    "openai==3.46.0",
    "python-dotenv==1.2.4",
    "dilithium-py==1.5.1",
    "segno==1.6.6",
    "fpdf2==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
